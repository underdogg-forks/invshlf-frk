name: Check

# Run this workflow every time a new commit pushed to your repository
on:
    # Temporarily disabled: only manual triggering is allowed.
    # push:
    #     paths-ignore:
    #         - '.github/**/*'
    #         - '**/*.md'
    #         - 'public/build/*.js'
    #         - 'public/build/**/*.js'
    #         - 'docker/**/*'
    #         - 'resources/scripts/**/*'
    #     tags-ignore:
    #         - "*"
    #     branches-ignore:
    #         - 'translations'
    # pull_request:
    #     paths-ignore:
    #         - '**/*.md'
    #         - 'public/build/*.js'
    #         - 'public/build/**/*.js'
    #     branches-ignore:
    #         - 'translations'
    # Allow manually triggering the workflow.
    workflow_dispatch:
        inputs:
            fix_pint_errors:
                description: 'Fix Pint code style errors automatically (runs pint in fix mode instead of test mode)'
                required: false
                type: boolean
                default: false

jobs:
    php_syntax_errors:
        name: 1️⃣ PHP Code Style errors
        runs-on: ubuntu-latest
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install dependencies
              uses: ramsey/composer-install@v2

            - name: Check source code for syntax errors
              run: |
                  if [ "${{ inputs.fix_pint_errors }}" = "true" ]; then
                      ./vendor/bin/pint
                  else
                      ./vendor/bin/pint --test
                  fi

    tests:
        name: 2️⃣ PHP ${{ matrix.php-version }} Tests
        needs:
            - php_syntax_errors
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-version:
                    - 8.3
                    - 8.4
        env:
            extensions: bcmath, curl, dom, gd, imagick, json, libxml, mbstring, pcntl, pdo, pdo_mysql, zip

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP Action
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: ${{ env.extensions }}
                  coverage: xdebug
                  tools: pecl, composer

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v2

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install
              run: npm install

            - name: Compile Front-end
              run: npm run build

            - name: Apply tests ${{ matrix.php-version }}
              run: php artisan test
